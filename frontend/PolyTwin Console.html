document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"4b68398f-c574-47bb-ac5f-0fb437dd0cee\"><\/script>\n<\/head>\n<body>\n<x-dc>\n<helmet>\n<style>\n  /* 이 화면에는 @font-face 가 없어서 Pretendard 가 아니라 시스템 폰트로\n     떨어지고 있었다. index.html 과 같은 선언을 쓴다 —\n     두 화면의 글자가 달라 보이면 안 된다. */\n  @font-face { font-family:\"Pretendard\"; font-weight:300; font-display:swap;\n    src:url(\"assets/fonts/Pretendard-300.subset.woff2\") format(\"woff2\"); }\n  @font-face { font-family:\"Pretendard\"; font-weight:500; font-display:swap;\n    src:url(\"assets/fonts/Pretendard-500.subset.woff2\") format(\"woff2\"); }\n  @font-face { font-family:\"Pretendard\"; font-weight:700; font-display:swap;\n    src:url(\"assets/fonts/Pretendard-700.subset.woff2\") format(\"woff2\"); }\n  @font-face { font-family:\"Pretendard Full\"; font-weight:300; font-display:swap;\n    src:url(\"assets/fonts/Pretendard-300.full-ko.woff2\") format(\"woff2\"); }\n  @font-face { font-family:\"Pretendard Full\"; font-weight:500; font-display:swap;\n    src:url(\"assets/fonts/Pretendard-500.full-ko.woff2\") format(\"woff2\"); }\n  @font-face { font-family:\"Pretendard Full\"; font-weight:700; font-display:swap;\n    src:url(\"assets/fonts/Pretendard-700.full-ko.woff2\") format(\"woff2\"); }\n\n  /* 토큰 — DESIGN.md 확정값. 여기 없는 색은 쓰지 않는다.\n     ④ 라이브러리와 같은 선언을 쓴다. 두 화면이 다른 청록으로 보이면 안 된다. */\n  :root {\n    /* 표면 */\n    --bg-void:    #08090B;\n    --bg-void-ch: 8 9 11;      /* 위 값의 채널. 스크림 알파용, 새 색 아님 */\n    --bg-base:    #0E1216;\n    --bg-base-ch: 14 18 22;\n    --bg-panel:   #14181D;\n    --bg-raised:  #1A1E24;\n    /* 경계 */\n    --line:       #232830;\n    --line-hi:    #3B424C;\n    /* 텍스트 */\n    --text-hi:    #F2F4F7;\n    --text-mid:   #A8B0BA;\n    --text-lo:    #5F6873;\n    /* 액센트 — 1개 */\n    --accent:     #9BC33A;\n    --accent-ch:  155 195 58;\n    --accent-dim: #59721A;\n    /* 의미색 — 상태 전용 */\n    --ok:         #3DD68C;\n    --ok-ch:      61 214 140;\n    --warn:       #FFB74D;\n    --warn-ch:    255 183 77;\n    --crit:       #E8232A;\n    --crit-ch:    232 35 42;\n\n    --f-sans: \"Pretendard\", \"Pretendard Full\", -apple-system, BlinkMacSystemFont, \"Malgun Gothic\", sans-serif;\n    --f-mono: \"IBM Plex Mono\", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;\n\n    --r-sm: 2px;\n    --r-md: 4px;\n\n    --e-out: cubic-bezier(0.16, 1, 0.3, 1);\n    --t-fast: 120ms;\n    --t-base: 200ms;\n    --t-slow: 400ms;\n  }\n\n  *, *::before, *::after { box-sizing: border-box; }\n  html, body { margin: 0; padding: 0; background: var(--bg-void); overflow: hidden; }\n  body { font-family: var(--f-sans); -webkit-font-smoothing: antialiased;\n         word-break: keep-all; font-variant-numeric: tabular-nums; }\n  a { color: var(--text-mid); text-decoration: none; }\n  a:hover { color: var(--text-hi); }\n\n  /* 클릭 요소가 div 라 기본 포커스 링이 없다. 직접 준다. */\n  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }\n\n  input[type=\"range\"] { -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent; cursor: pointer; }\n  input[type=\"range\"]::-webkit-slider-runnable-track { height: 2px; background: var(--line); }\n  input[type=\"range\"]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; margin-top: -5px; border-radius: 50%; background: var(--text-hi); }\n  input[type=\"range\"]:hover::-webkit-slider-thumb { background: var(--accent); }\n  input[type=\"range\"]::-moz-range-track { height: 2px; background: var(--line); }\n  input[type=\"range\"]::-moz-range-thumb { width: 12px; height: 12px; border: 0; border-radius: 50%; background: var(--text-hi); }\n\n  /* 공정이 도는 동안만 켜지는 표시등. 값이 아니라 상태를 알리는 것이라\n     여기에는 이징을 써도 된다 — 계측 수치에는 쓰지 않는다 */\n  .pt-live { animation: pt-blink 1.6s var(--e-out) infinite; }\n  @keyframes pt-blink { 0%, 100% { opacity: 1 } 50% { opacity: 0.25 } }\n\n  /* 3D 가 계속 도는 화면이다. 모션을 줄여 달라고 하면 전환은 멈춘다.\n     (뷰포트 렌더 루프 자체는 공정 표시라 남긴다) */\n  @media (prefers-reduced-motion: reduce) {\n    *, *::before, *::after {\n      animation-duration: 1ms !important;\n      animation-iteration-count: 1 !important;\n      transition-duration: 1ms !important;\n    }\n  }\n<\/style>\n<script type=\"module\" src=\"79b1de60-ed4e-4e8e-88e9-89de853dfefc\"><\/script>\n<\/helmet>\n<div style=\"position: fixed; inset: 0; display: grid; grid-template-columns: 72px 1fr clamp(380px, 29vw, 430px); background: var(--bg-void); color: var(--text-hi)\">\n\n  <aside style=\"border-right: 1px solid var(--bg-panel); display: flex; flex-direction: column; align-items: center; padding: 18px 0; gap: 22px\">\n    <div style=\"font-family: var(--f-mono); font-size: 12px; letter-spacing: 0.18em; color: var(--text-lo)\">PT<\/div>\n    <div style=\"display: flex; flex-direction: column; gap: 12px\">\n      <sc-for list=\"{{ vehicles }}\" as=\"v\" hint-placeholder-count=\"3\">\n        <div sc-camel-on-click=\"{{ v.pick }}\" title=\"{{ v.name }}\" style=\"width: 44px; height: 44px; border: 1px solid {{ v.border }}; background: {{ v.bg }}; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background-color 200ms cubic-bezier(0.4,0,0.2,1), border-color 200ms cubic-bezier(0.4,0,0.2,1), color 200ms cubic-bezier(0.4,0,0.2,1)\">\n          <div style=\"width: 26px; height: 9px; border-radius: 5px 6px 3px 3px; background: {{ v.swatch }}\"><\/div>\n        <\/div>\n      <\/sc-for>\n    <\/div>\n    <div style=\"flex: 1\"><\/div>\n    <div style=\"font-family: var(--f-mono); font-size: 12px; letter-spacing: 0.14em; color: var(--line); writing-mode: vertical-rl\">01 SETUP<\/div>\n  <\/aside>\n\n  <main style=\"position: relative; overflow: hidden\">\n    <header style=\"position: absolute; top: 0; left: 0; right: 0; z-index: 10; display: flex; align-items: baseline; gap: 20px; padding: 22px 26px; pointer-events: none\">\n      <div style=\"display: inline-flex; align-items: center; gap: 9px; font-size: 16px; font-weight: 300; letter-spacing: 0.3em\">\n        <svg viewBox=\"0 0 130 78\" width=\"28\" height=\"16.8\" aria-hidden=\"true\" focusable=\"false\" style=\"flex: none\">\n          <path style=\"fill: currentColor\" d=\"M29.1 4.25Q33 2 36.9 4.25L62.4 19Q65 20.5 62.76 22.49C53.5 30.5 53.5 47.5 62.76 55.51Q65 57.5 62.4 59L36.9 73.75Q33 76 29.1 73.75L4.9 59.75Q1 57.5 1 53L1 25Q1 20.5 4.9 18.25Z\"/>\n          <path style=\"fill: var(--accent)\" d=\"M100.9 4.25Q97 2 93.1 4.25L67.6 19Q65 20.5 67.24 22.49C76.5 30.5 76.5 47.5 67.24 55.51Q65 57.5 67.6 59L93.1 73.75Q97 76 100.9 73.75L125.1 59.75Q129 57.5 129 53L129 25Q129 20.5 125.1 18.25Z\"/>\n        <\/svg>\n        <span>POLY<span style=\"color: var(--accent)\">TWIN<\/span><\/span>\n      <\/div>\n      <a href=\"index.html\" title=\"메인으로\" style=\"font-size: 14px; color: var(--text-lo); letter-spacing: 0.06em; text-decoration: none; margin-right: 14px\">← 메인<\/a>\n      <div style=\"font-size: 15px; color: var(--text-lo)\">차량 3D · 파라미터 설정<\/div>\n      <div style=\"flex: 1\"><\/div>\n      <div style=\"font-family: var(--f-mono); font-size: 15px; color: var(--text-mid)\">{{ vehicleName }}<\/div>\n    <\/header>\n\n    <polytwin-viewport style=\"position: absolute; inset: 0\"><\/polytwin-viewport>\n\n    <div style=\"position: absolute; left: 26px; bottom: 22px; z-index: 10; display: flex; gap: 26px; font-family: var(--f-mono); font-size: 16px; color: var(--text-lo); pointer-events: none\">\n      <div>경로 간격 <span style=\"color: var(--accent)\">{{ spacing }}<\/span> mm<\/div>\n      <div>패스 <span style=\"color: var(--text-mid)\">{{ passes }}<\/span><\/div>\n      <div>추정 <span style=\"color: var(--text-mid)\">{{ eta }}<\/span><\/div>\n    <\/div>\n\n    <div style=\"position: absolute; right: 26px; bottom: 22px; z-index: 10; display: flex; gap: 6px\">\n      <sc-for list=\"{{ views }}\" as=\"v\" hint-placeholder-count=\"4\">\n        <div sc-camel-on-click=\"{{ v.pick }}\" style=\"padding: 8px 14px; border: 1px solid {{ v.border }}; font-size: 14px; letter-spacing: 0.08em; color: {{ v.color }}; cursor: pointer; transition: background-color 200ms cubic-bezier(0.4,0,0.2,1), border-color 200ms cubic-bezier(0.4,0,0.2,1), color 200ms cubic-bezier(0.4,0,0.2,1)\">{{ v.label }}<\/div>\n      <\/sc-for>\n    <\/div>\n  <\/main>\n\n  <aside style=\"border-left: 1px solid var(--bg-panel); background: rgb(var(--bg-base-ch) / 0.72); backdrop-filter: blur(14px); display: flex; flex-direction: column; overflow: hidden\">\n    <div style=\"padding: 22px 22px 16px; border-bottom: 1px solid var(--bg-panel); display: flex; align-items: center; gap: 10px\">\n      <div style=\"font-size: 16px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-lo)\">{{ panelTitle }}<\/div>\n      <div style=\"flex: 1\"><\/div>\n      <sc-if value=\"{{ running }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display: flex; align-items: center; gap: 7px\">\n          <div class=\"pt-live\" style=\"width: 6px; height: 6px; border-radius: 50%; background: var(--accent)\"><\/div>\n          <div style=\"font-family: var(--f-mono); font-size: 13px; letter-spacing: 0.14em; color: var(--accent)\">RUNNING<\/div>\n        <\/div>\n      <\/sc-if>\n    <\/div>\n    <div style=\"flex: 1; overflow-y: auto; padding: 20px 22px 22px; display: flex; flex-direction: column; gap: 26px\">\n    <sc-if value=\"{{ idle }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"display: flex; flex-direction: column; gap: 26px\">\n      <section style=\"border: 1px solid var(--bg-panel); padding: 16px; display: flex; flex-direction: column; gap: 24px\">\n        <div>\n          <div style=\"display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px\">\n            <div style=\"font-size: 14px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-lo)\">차체 리프트(Car Lift)<\/div>\n            <div style=\"font-family: var(--f-mono); font-size: 16px; color: {{ carLiftColor }}; font-variant-numeric: tabular-nums\">{{ carLiftLabel }}<\/div>\n          <\/div>\n          <input type=\"range\" min=\"0\" max=\"800\" step=\"50\" value=\"{{ carLift }}\" sc-camel-on-input=\"{{ setCarLift }}\" aria-label=\"차체 리프트 높이\">\n          <div style=\"font-size: 16px; color: var(--text-mid); line-height: 1.5; margin-top: 10px; word-break: keep-all\">{{ carLiftNote }}<\/div>\n        <\/div>\n        <div>\n          <div style=\"font-size: 14px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-lo); margin-bottom: 12px\">로봇 팔(Robot Arms) 대수<\/div>\n          <div style=\"display: flex; gap: 8px\">\n            <sc-for list=\"{{ robotCounts }}\" as=\"rc\" hint-placeholder-count=\"3\">\n              <div sc-camel-on-click=\"{{ rc.pick }}\" style=\"flex: 1; padding: 10px 0; border: 1px solid {{ rc.border }}; background: {{ rc.bg }}; font-size: 15px; color: {{ rc.color }}; text-align: center; cursor: pointer; transition: background-color 200ms ease, border-color 200ms ease, color 200ms ease\">{{ rc.label }}<\/div>\n            <\/sc-for>\n          <\/div>\n        <\/div>\n        <div>\n          <div style=\"font-size: 14px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-lo); margin-bottom: 12px\">폴리셔(Polisher) 종류<\/div>\n          <div style=\"display: flex; gap: 8px\">\n            <sc-for list=\"{{ tools }}\" as=\"t\" hint-placeholder-count=\"2\">\n              <div sc-camel-on-click=\"{{ t.pick }}\" style=\"flex: 1; padding: 10px 0; border: 1px solid {{ t.border }}; background: {{ t.bg }}; font-size: 15px; color: {{ t.color }}; text-align: center; cursor: pointer; transition: background-color 200ms ease, border-color 200ms ease, color 200ms ease\">{{ t.label }}<\/div>\n            <\/sc-for>\n          <\/div>\n          <div style=\"margin-top: 10px; font-size: 16px; line-height: 1.5; color: var(--text-lo); word-break: keep-all\">{{ toolNote }}<\/div>\n        <\/div>\n        <div>\n          <div style=\"display: flex; align-items: center; justify-content: space-between\">\n            <div style=\"font-size: 14px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-lo)\">이동 레일(Rail) 추가<\/div>\n            <div sc-camel-on-click=\"{{ toggleRail }}\" style=\"width: 40px; height: 22px; border-radius: 11px; background: {{ railBg }}; position: relative; cursor: pointer; transition: background 200ms ease\">\n              <div style=\"position: absolute; top: 2px; left: {{ railDotLeft }}; width: 18px; height: 18px; border-radius: 50%; background: var(--text-hi); transition: left 200ms ease\"><\/div>\n            <\/div>\n          <\/div>\n        <\/div>\n        <div>\n          <div style=\"display: flex; align-items: center; justify-content: space-between\">\n            <div style=\"font-size: 14px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-lo)\">작업용 리프트(Lift) 추가<\/div>\n            <div sc-camel-on-click=\"{{ toggleLift }}\" style=\"width: 40px; height: 22px; border-radius: 11px; background: {{ liftBg }}; position: relative; cursor: pointer; transition: background 200ms ease\">\n              <div style=\"position: absolute; top: 2px; left: {{ liftDotLeft }}; width: 18px; height: 18px; border-radius: 50%; background: var(--text-hi); transition: left 200ms ease\"><\/div>\n            <\/div>\n          <\/div>\n        <\/div>\n      <\/section>\n      <section style=\"border: 1px solid var(--bg-panel); padding: 15px 16px 13px\">\n        <div style=\"font-size: 14px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-lo); margin-bottom: 10px\">레시피 프리셋<\/div>\n        <select sc-camel-on-input=\"{{ setRecipe }}\" aria-label=\"레시피 프리셋\" style=\"width: 100%; padding: 8px 10px; border: 1px solid var(--line); background: var(--bg-void); color: var(--text-mid); font-size: 14px; border-radius: var(--r-sm)\">\n          <option value=\"base\">기준 (BO 최적)<\/option>\n          <option value=\"fast\">시간 단축 (이송 ×1.5 · 힘 ×1.15)<\/option>\n          <option value=\"quality\">품질 우선 (이송 ×1.3)<\/option>\n        <\/select>\n        <div style=\"margin-top: 8px; font-size: 14px; color: var(--text-lo); line-height: 1.5; word-break: keep-all\">{{ recipeNote }}<\/div>\n      <\/section>\n      <div style=\"padding: 16px; background: rgb(var(--accent-ch) / 0.06); border: 1px solid var(--line)\">\n        <div style=\"font-size: 15px; color: var(--accent); margin-bottom: 8px\">RL 최적화 안내<\/div>\n        <div style=\"font-size: 16px; color: var(--text-mid); line-height: 1.5\">\n          환경 설정 후 공정을 시작하면, AI가 해당 하드웨어 조건에서 최적의 폴리싱 파라미터(압력, 속도 등)를 탐색한다.\n        <\/div>\n      <\/div>\n    <\/div>\n    <\/sc-if>\n\n    <sc-if value=\"{{ running }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"display: flex; flex-direction: column; gap: 22px\">\n\n      <section>\n        <div style=\"display: flex; align-items: baseline; gap: 8px\">\n          <div style=\"font-family: var(--f-mono); font-size: 34px; font-weight: 300; color: var(--text-hi); line-height: 1; font-variant-numeric: tabular-nums\">{{ monPct }}<\/div>\n          <div style=\"font-size: 16px; color: var(--text-lo)\">%<\/div>\n          <div style=\"flex: 1\"><\/div>\n          <div style=\"font-size: 14px; color: {{ monStateColor }}\">{{ monStateLabel }}<\/div>\n        <\/div>\n        <div style=\"margin-top: 12px; height: 4px; background: var(--bg-panel); border-radius: var(--r-sm); overflow: hidden\">\n          <div style=\"width: {{ monBarW }}; height: 100%; background: var(--accent)\"><\/div>\n        <\/div>\n        <div style=\"margin-top: 9px; display: grid; grid-template-columns: auto 1fr; column-gap: 12px; row-gap: 4px; font-family: var(--f-mono); font-size: 15px; color: var(--text-lo); font-variant-numeric: tabular-nums; white-space: nowrap\">\n          <div>경과<\/div><div style=\"color: var(--text-mid); text-align: right\">{{ monElapsed }}<\/div>\n          <div>남음<\/div><div style=\"color: var(--text-mid); text-align: right\">{{ monLeft }}<\/div>\n          <div>총<\/div><div style=\"text-align: right\">{{ monTotal }}<\/div>\n        <\/div>\n      <\/section>\n\n      <sc-if value=\"{{ showContact }}\" hint-placeholder-val=\"{{ false }}\">\n      <section style=\"border: 1px solid var(--bg-panel); padding: 13px 16px 12px\">\n        <div style=\"display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px\">\n          <div style=\"font-size: 14px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-lo)\">패드 접촉 정합<\/div>\n          <div style=\"flex: 1\"><\/div>\n          <div style=\"font-family: var(--f-mono); font-size: 16px; color: {{ contactRateColor }}\">{{ contactRate }}<\/div>\n        <\/div>\n        <sc-for list=\"{{ contactRows }}\" as=\"c\" hint-placeholder-count=\"3\">\n          <div style=\"display: grid; grid-template-columns: 34px 1fr auto; gap: 8px; padding: 4px 0; font-size: 14px; color: var(--text-mid); font-variant-numeric: tabular-nums\">\n            <div style=\"font-family: var(--f-mono); color: var(--text-lo)\">{{ c.id }}<\/div>\n            <div style=\"color: {{ c.color }}\">{{ c.state }}<\/div>\n            <div style=\"font-family: var(--f-mono); color: var(--text-lo)\">{{ c.detail }}<\/div>\n          <\/div>\n        <\/sc-for>\n        <div style=\"margin-top: 6px; font-size: 13px; color: var(--text-lo); line-height: 1.5; word-break: keep-all\">거리 12 mm·각도 12° 이내면 접촉. 이탈 구간은 도달 한계(곡면·가장자리)로 실제 공정에서도 재작업 후보가 된다.<\/div>\n      <\/section>\n      <\/sc-if>\n\n      <sc-if value=\"{{ showCtl }}\" hint-placeholder-val=\"{{ false }}\">\n      <section style=\"border: 1px solid var(--bg-panel); padding: 13px 16px 12px\">\n        <div style=\"display: flex; align-items: baseline; gap: 10px  word-break: keep-all\">{{ evalIntro }}<\/div>\n        <\/div>\n\n        <sc-if value=\"{{ hasQual }}\" hint-placeholder-val=\"{{ true }}\">\n        <div>\n          <div style=\"display: flex; align-items: baseline; gap: 12px; margin-bottom: 12px\">\n            <div style=\"font-size: 18px; font-weight: 600; color: var(--text-hi)\">표면 품질 · 합격 기준 대조<\/div>\n            <div style=\"flex: 1\"><\/div>\n            <div style=\"font-size: 16px; color: var(--text-lo)\">{{ qualEpLabel }}<\/div>\n          <\/div>\n          <div style=\"border: 1px solid var(--bg-panel); background: var(--bg-void)\">\n            <div style=\"display: grid; grid-template-columns: minmax(0, 1fr) 130px 190px 74px; gap: 12px; padding: 13px 20px; border-bottom: 1px solid var(--bg-panel); font-size: 16px; font-weight: 500; letter-spacing: 0.04em; color: var(--text-lo)\">\n              <div>항목<\/div>\n              <div style=\"text-align: right\">공정 결과<\/div>\n              <div style=\"text-align: right\">기준<\/div>\n              <div style=\"text-align: right\">판정<\/div>\n            <\/div>\n            <div style=\"padding: 6px 20px 16px\">\n              <sc-for list=\"{{ qualRows }}\" as=\"q\" hint-placeholder-count=\"5\">\n                <div style=\"border-bottom: 1px solid var(--bg-base); padding: 9px 0\">\n                  <div style=\"display: grid; grid-template-columns: minmax(0, 1fr) 130px 190px 74px; gap: 12px; align-items: baseline\">\n                    <div style=\"font-size: 17px; color: var(--text-mid); word-break: keep-all\">{{ q.label }}<\/div>\n                    <div style=\"text-align: right\"><span style=\"font-size: 21px; font-weight: 500; color: {{ q.color }}; font-variant-numeric: tabular-nums\">{{ q.mine }}<\/span> <span style=\"font-size: 15px; color: var(--text-lo)\">{{ q.unit }}<\/span><\/div>\n                    <div style=\"font-size: 17px; color: var(--text-lo); text-align: right; font-variant-numeric: tabular-nums\">{{ q.limit }}<\/div>\n 20px; border-bottom: 1px solid var(--bg-panel); font-size: 17px; font-weight: 500; letter-spacing: 0.04em; color: var(--text-mid)\">숙련공 정답 · 데이터셋<\/div>\n            <div style=\"padding: 6px 20px 16px\">\n            <sc-for list=\"{{ evalRows }}\" as=\"r\" hint-placeholder-count=\"5\">\n              <div style=\"display: flex; align-items: baseline; gap: 12px; height: 40px; border-bottom: 1px solid var(--bg-base)\">\n                <div style=\"font-size: 17px; color: var(--text-mid); white-space: nowrap\">{{ r.label }}<\/div>\n                <div style=\"flex: 1\"><\/div>\n                <div style=\"font-size: 21px; font-weight: 500; color: var(--text-hi); font-variant-numeric: tabular-nums\">{{ r.ref }}<\/div>\n                <div style=\"font-size: 16px; color: var(--text-lo); width: 66px; text-align: right\">{{ r.unit }}<\/div>\n              <\/div>\n            <\/sc-for>\n            <\/div>\n          <\/div>\n        <\/div>\n\n        <div style=\"display: flex; align-items: baseline; gap: 16px; padding: 15px 20px; border: 1px solid {{ verdictBorder }}; background: {{ verdictBg }}\">\n          <div style=\"font-size: 19px; font-weight: 600; color: {{ verdictColor }}; white-space: nowrap\">{{ verdictTitle }}<\/div>\n          <div style=\"font-size: 17px; color: var(--text-mid); line-height: 1.6; word-break: keep-all\">{{ verdictText }}<\/div>\n        <\/div>\n\n        <div style=\"font-family: var(--f-mono); font-size: 15px; color: var(--text-lo); word-break: break-all\">{{ evalSource }}<\/div>\n\n        <div style=\"display: flex; gap: 14px\">\n          <div sc-camel-on-click=\"{{ evalFail }}\" tabindex=\"0\" style=\"flex: 1; padding: 15px 0; border: 1px solid var(--line); font-size: 18px; color: var(--text-mid); text-align: center; cursor: pointer; transition: border-color 200ms cubic-bezier(0.4,0,0.2,1), color 200ms cubic-bezier(0.4,0,0.2,1)\" style-hover=\"border-color: var(--text-lo); color: var(--text-hi)\">{{ btnLeftLabel }}<\/div>\n          <div sc-camel-on-click=\"{{ btnRightAction }}\" tabindex=\"0\" style=\"flex: 1; padding: 15px 0; border: 1px solid {{ saveBorder }}; background: {{ saveBg }}; font-size: 18px; font-weight: 500; color: {{ saveColor }}; text-align: center; cursor: {{ saveCursor }}; transition: border-color 200ms cubic-bezier(0.4,0,0.2,1), color 200ms cubic-bezier(0.4,0,0.2,1)\">{{ btnRightLabel }}<\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/sc-if>\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}\">\nconst CARS = [\n  { id: 'z4', name: 'BMW Z4', swatch: '#6E7681' },\n  { id: 'scan', name: 'BMW Z4 · 스캔(Isaac)', swatch: '#5B6068' },   // 시뮬레이션이 쓰는 스캔 차체 — 동기화 시 자동 선택\n  { id: 'coupe', name: '벤츠 쿠페', swatch: '#4A5058' },\n  { id: 'sf90', name: '페라리 SF90', swatch: '#7A3238' },\n];\n\n// 광택기 두 종류 — 「자동차 광택」 2. 광택의 종류.\n// 싱글은 연마력이 월등하고 작업이 빠르지만 기계자국·홀로그램을 남길 수 있어\n// 숙련자만 쓴다. 듀얼은 자국을 남기지 않는 대신 시간이 더 걸린다.\n// 접촉력이 일정한 로봇에는 그 숙련도 제약이 없다 — 이 화면이 고르게 하는 이유다.\n// 경로 간격 = 패드 지름 x (1 - 오버랩). 라이브러리 레시피와 같은 규칙.\n// force 는 3~8 N 대역 안이어야 한다 — 이탈하면 접촉 게이트가 실행을 막는다.\n// 값은 데이터셋 목표 접촉력 분포(3.29~8.22 N, 중앙값 4.46)를 따른다.\nconst TOOLS = [\n  { id: 'dual',   label: '듀얼', pad: 110, overlap: 40, rpm: 3000, force: 5.6, feed: 0.030,\n    note: '기계자국과 홀로그램을 남기지 않는다. 대신 같은 면적에 시간이 더 걸린다.' },\n  { id: 'single', label: '싱글', pad: 140, overlap: 35, rpm: 2400, force: 7.2, feed: 0.030,\n    note: '연마력이 월등하고 빠르다. 사람에게는 홀로그램 위험 때문에 숙련자 전용이지만, 접촉력이 일정한 로봇에는 그 제약이 없다.' },\n];\nconst toolOf = (id) => TOOLS.find((t) => t.id === id) || TOOLS[0];\n\n// ── 숙련공 정답 데이터 ──\n// 데이터셋/seg_best_kpi.json — sweep_traj_csv 원본(184MB)에서 세그먼트마다\n// '세그먼트별_최적파라미터.csv 의 최적 파라미터와 일치하는 run' 을 찾아\n// 그 run 의 실제 KPI 와 파일 내 바이트 범위를 뽑아 둔 요약이다.\n// 만드는 방법과 재생성 명령은 데이터셋/make_seed.py 에 있다.\n/* 숙련공 정답 데이터 — DB(segments 테이블)에서 온다. 예전에는\n   데이터셋/seg_best_kpi.json 을 직접 읽었다. 모양은 그때와 같다 */\nconst SEED_URL = '/api/dataset/seg-best-kpi';\n\n// 표면 품질 KPI — 데이터셋/make_quality.py 가 data_sample.txt 에서 뽑는다.\n// 원본은 셀 단위 2.4 MB 라 브라우저가 매번 파싱할 물건이 아니다.\nconst QUALITY_URL = '/api/dataset/quality-kpi';\n\n// 허용 오차 — 이 안에 들면 '일치'로 본다.\n// 접촉력만 절대값(N), 나머지는 정답 대비 상대비. in-band 는 아래로만 본다.\nconst TOL = { force: 0.40, stiffness: 0.06, damping: 0.08, speed: 0.10, inband: 0.02 };\n\n// run 순번으로 결정되는 난수 — 실행할 때마다 결과가 달라지되,\n// 같은 순번이면 같은 값이 나와 데모 중에 재현이 된다.\nfunction lcg(seed) {\n  let x = (seed >>> 0) || 1;\n  return () => (x = (Math.imul(x, 1664525) + 1013904223) >>> 0) / 4294967296;\n}\nconst mmss = (sec) => `${String(Math.floor(sec / 60)).padStart(2, '0')}:${String(sec % 60).padStart(2, '0')}`;\n// 시뮬 시각(수 시간)용: h:mm:ss\nconst hhmm = (sec) => { sec = Math.max(0, Math.round(sec)); const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), x = sec % 60;\n  return (h ? h + ':' : '') + String(m).padStart(2, '0') + ':' + String(x).padStart(2, '0'); };\n\nclass Component extends DCLogic {\n  state = {\n    vehicle: 'z4',\n    tool: 'dual',\n    view: 'free',\n    running: false,\n    robotCount: 1,\n    hasRail: false,\n    hasLift: false,\n    carLift: 0,          // mm. 차체를 들어 옆면을 로봇 어깨 높이로 올린다\n    showEvalModal: false,\n    seed: null,          // 데이터셋 요약. null 이면 아직 못 읽었다\n    seedErr: '',\n    qual: null,          // 표면 품질 KPI. null 이면 아직 못 읽었다\n    qualEp: null,        // 이번 판정에 쓴 에피소드\n    runSeq: 0,           // 몇 번째 RL 실행인가 — 대상 세그먼트와 난수를 정한다\n    refSeg: null,        // 이번 판정의 숙련공 정답 세그먼트\n    rl: null,            // 이번 판정의 공정 결과\n    evalSaved: false, evalSaving: false, evalErr: '',\n    hasPreset: false,\n    runMs: 0,            // 이번 공정의 길이. 실행마다 30~60초에서 새로 뽑는다\n    runEl: 0,            // 경과 ms\n    mon: null,           // 공정 중 계측값. 대기 중에는 null\n    recipe: 'base',      // 레시피 프리셋: base(기준) | fast(이송×1.5·힘×1.15, −43%) | quality(이송×1.3, 148/150)\n    ctl: { pause: false, force_scale: 1, feed_scale: 1 },   // 실행 중 컨트롤 (서버 /api/sim/control 과 동기)\n    workerOnline: null,  // 큐 모드 워커 하트비트 (null = 로컬 모드/미상)\n    runs: [],            // 서버에 저장된 시뮬 기록 목록 (/api/runs)\n    replayId: '',        // 재생 중인 기록 id\n    cellsOn: false,      // 3D 셀 판정 지도 표시 (기본 끔)\n    simCond: null,       // 시뮬(피드/기록)이 보고한 공정 조건 {recipe, robots, params} — 상태줄·조건 대조\n    contact: null,       // 콘솔 애니메이션 실측 접촉 품질 {rows:[{id,working,dist,angle,ok}], rate}\n    showCondModal: false, condRows: [],   // 공정 실행 조건 오류 팝업\n    replay: null,        // 재생기 상태 {t, duration, playing, speed, follow, status, active}\n  };\n\n  componentDidMount() {\n    this.push();\n    this.fetchRuns();\n    /* PolyTwin Console.html?run=<id> — 라이브러리/모니터에서 온 재생 링크 */\n    try {\n      const rid = Number(new URLSearchParams(location.search).get('run'));\n      if (rid) setTimeout(() => this.loadReplay(rid), 800);\n    } catch (e) { /* 무시 */ }\n    this._runsTimer = setInterval(() => { if (!this.state.running && !(this.state.replay && this.state.replay.active)) this.fetchRuns(); }, 10000);\n    /* credentials 를 빼면 세션 쿠키가 안 실려 401 이 온다 */\n    fetch(SEED_URL, { credentials: 'same-origin' })\n      .then((r) => r.json().catch(() => ({})).then((d) => {\n        if (!r.ok) throw new Error(d.error || 'HTTP ' + r.status);\n        return d;\n      }))\n      .then((d) => this.setState({ seed: d.segments || [] }))\n      .catch((err) => this.setState({ seedErr: String(err.message || err) }));\n    fetch(QUALITY_URL, { credentials: 'same-origin' })\n      .then((r) => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })\n      .then((d) => this.setState({ qual: d }))\n      .catch(() => this.setState({ qual: null }));   // 없으면 품질표를 접는다\n    this.setState({ hasPreset: !!this.readPreset() });\n  }\n  componentWillUnmount() { clearTimeout(this._simTimer); clearInterval(this._monTimer); }\n\n  vp() { return document.querySelector('polytwin-viewport'); }\n\n  push() {\n    const v = this.vp();\n    if (!v || !v.setParams) { setTimeout(() => this.push(), 150); return; }\n    const s = this.state;\n    const t = toolOf(s.tool);\n    v.setParams({ pad: t.pad, overlap: t.overlap, feed: t.feed, force: t.force, rpm: t.rpm,\n                  robotCount: s.robotCount, hasRail: s.hasRail, hasLift: s.hasLift,\n                  carLift: s.carLift / 1000, running: s.running });\n  }\n\n  pickVehicle(id) {\n    if (id === this.state.vehicle) return;\n    this.setState({ vehicle: id });\n    const v = this.vp();\n    if (v && v.setVehicle) v.setVehicle(id);\n  }\n\n  pickView(id) {\n    this.setState({ view: id });\n    const v = this.vp();\n    if (v && v.setView) v.setView(id);\n  }\n\n  stopTimers() {\n    clearTimeout(this._simTimer); clearInterval(this._monTimer); clearInterval(this._liveTimer);\n    const v = this.vp(); if (v && v.setLive) v.setLive(null);\n  }\n\n  /* ══ 실제 시뮬레이션 실행 (백엔드 /api/sim/*) ═══════════════════════\n     로컬 서버가 Isaac Sim(원코드 v5 + 잔차 정책)을 띄우고, 모니터는 /api/monitor 피드로 채운다.\n     런처가 없는 환경(배포 서버 501, 네트워크 오류)에서는 기존 데모 흐름으로 돌아간다. */\n  /* ══ 기록 재생 (DB 에 저장된 시뮬 프레임을 보간 재생 — 실시간 폴링 렉 없음) ══ */\n  fetchRuns() {\n    fetch('/api/runs', { credentials: 'same-origin', cache: 'no-store' }).then((r) => r.json())\n      .then((d) => this.setState({ runs: d.runs || [] })).catch(() => {});\n  }\n  loadReplay(id, keepTimers) {\n    const v = this.vp(); if (!v || !v.replay) return;\n    const pl = v.replay, t = toolOf(this.state.tool);\n    pl.onState = (st) => this.setState({ replay: { ...st, active: true } });\n    pl.onFrame = (feed) => {\n      const now = performance.now();\n      if (now - (this._rpEmit || 0) < 200) return;     // 표시 갱신은 5 Hz — 3D 는 60 fps 로 따로 돈다\n      this._rpEmit = now;\n      /* 접촉 품질(콘솔 애니메이션 실측): 로봇별 패드-표면 거리·각도. 정합률은 최근 100 표본의 ok 비율 */\n      const cq = (v.getContact ? v.getContact() : []);\n      const hist = this._cqHist || (this._cqHist = []);\n      for (const c of cq) if (c.working) { hist.push(c.ok ? 1 : 0); if (hist.length > 100) hist.shift(); }\n      const rate = hist.length ? Math.round(100 * hist.reduce((a, b) => a + b, 0) / hist.length) : null;\n      const mon = this.liveMon(feed, t);\n      /* 커버리지·도달률은 콘솔 3D 실측: 실제로 닦인 면적 비율(광택 마스크), 팔이 맡은 작업점/전체 작업점 */\n      const st = v.getStats ? v.getStats() : null;\n      if (st) { mon.points = st.points || 0; mon.assigned = st.assigned || 0; if (st.polished !== null && st.polished !== undefined) mon.cov = st.polished * 100; }\n      this.setState({ mon, contact: { rows: cq, rate } });\n    };\n    if (!keepTimers) this.stopTimers();\n    this.setState({ replayId: String(id), mon: null }, () => {\n      pl.load(id).then((run) => {\n        /* 기록에 저장된 환경 설정(대수·레일·리프트·툴·차 리프트·레시피)을 그대로 복원 — 화면 배치가 그 기록의 조건과 같아진다 */\n        const pr = run && run.meta && run.meta.params;\n        if (pr && !keepTimers) {\n          const env = {};\n          if (pr.robotCount) env.robotCount = Math.max(1, Math.min(3, Number(pr.robotCount)));\n          if (pr.hasRail !== undefined) env.hasRail = !!pr.hasRail;\n          if (pr.hasLift !== undefined) env.hasLift = !!pr.hasLift;\n          if (pr.tool && TOOLS && TOOLS[pr.tool]) env.tool = pr.tool;\n          if (pr.carLift !== undefined) env.carLift = Number(pr.carLift) || 0;\n          if (pr.recipe) env.recipe = String(pr.recipe);\n          const meta0 = (run && run.meta) || {};\n          this.setState(env, () => { this.push(); this._noteSimCond({ recipe: meta0.recipe_values || null, robots: (meta0.robots || []).map((r) => r.id), params: meta0.params || null }); });\n        } else {\n          const meta = (run && run.meta) || {};\n          this._noteSimCond({ recipe: meta.recipe_values || null, robots: (meta.robots || []).map((r) => r.id), params: meta.params || null });\n        }\n        pl.play(); this.push();\n      }).catch((e) => console.warn('기록 로드 실패', e));\n    });\n  }\n  stopReplay() {\n    const v = this.vp(); if (v && v._replay) v.replay.stop();\n    this.setState({ replay: null, replayId: '', mon: null }, () => this.push());\n  }\n  pickRun(e) { const id = Number(e.target.value); if (!id) this.stopReplay(); else this.loadReplay(id); }\n  deleteRun() {\n    const id = Number(this.state.replayId); if (!id) return;\n    const run = this.state.runs.find((r) => r.id === id);\n    if (!window.confirm('기록 \"' + ((run && run.name) || id) + '\" 을(를) 삭제할까요? 되돌릴 수 없습니다.')) return;\n    this.stopReplay();\n    fetch('/api/runs/' + id, { method: 'DELETE', credentials: 'same-origin' }).then((r) => r.json())\n      .then((d) => { if (d && d.error) window.alert(d.error); this.fetchRuns(); }).catch(() => this.fetchRuns());\n  }\n  replayToggle() {\n    const v = this.vp(); if (!v || !v._replay || !this.state.replay) return;\n    if (this.state.replay.playing) v.replay.pause(); else v.replay.play();\n  }\n  replaySeek(e) {\n    const v = this.vp(); if (!v || !v._replay || !this.state.replay) return;\n    v.replay.seek(Number(e.target.value) / 1000 * this.state.replay.duration);\n  }\n  replaySpeed(e) { const v = this.vp(); if (v && v._replay) v.replay.setSpeed(Number(e.target.value) || 1); }\n\n  /* ══ 공정 실행 조건 대조 — 시뮬(피드/기록)이 보고한 조건과 콘솔 설정이 다르면 \"공정 실행 조건 오류\" 팝업 ══ */\n  _noteSimCond(cond) {\n    const sig = JSON.stringify(cond);\n    if (sig === this._condSig) return;\n    this._condSig = sig;\n    this.setState({ simCond: cond }, () => this.checkSimCond());\n  }\n  checkSimCond() {\n    const s = this.state, c = s.simCond; if (!c) return;\n    const t = toolOf(s.tool), rows = [];\n    const add = (name, sim, ui) => { if (sim !== undefined && sim !== null && String(sim) !== String(ui)) rows.push({ name, sim: String(sim), ui: String(ui) }); };\n    const uiSet = ({ 1: ['C'], 2: ['SL', 'SR'], 3: ['C', 'SL', 'SR'] })[s.robotCount] || [];\n    if (c.robots && c.robots.length) {\n      const simSet = c.robots.slice().sort().join('/'), mine = uiSet.slice().sort().join('/');\n      if (simSet !== mine) rows.push({ name: '로봇 구성', sim: c.robots.length + '대 (' + c.robots.join('/') + ')', ui: s.robotCount + '대 (' + uiSet.join('/') + ')' });\n    }\n    if (c.recipe && c.recipe.pad_radius_m) add('패드 지름', Math.round(c.recipe.pad_radius_m * 2000) + ' mm', t.pad + ' mm');\n    if (c.params) {\n      if (c.params.hasRail !== undefined) add('이동 레일', c.params.hasRail ? '있음' : '없음', s.hasRail ? '있음' : '없음');\n      if (c.params.hasLift !== undefined) add('작업 리프트', c.params.hasLift ? '있음' : '없음', s.hasLift ? '있음' : '없음');\n      if (c.params.tool) add('툴', c.params.tool, s.tool);\n    }\n    const sig = JSON.stringify(rows);\n    if (rows.length && sig !== this._condShown) { this._condShown = sig; this.setState({ showCondModal: true, condRows: rows }); }\n    if (!rows.length) this.setState({ showCondModal: false, condRows: [] });\n  }\n  condApply() {\n    const c = this.state.simCond || {}, env = {};\n    if (c.params) {\n      if (c.params.robotCount) env.robotCount = Math.max(1, Math.min(3, Number(c.params.robotCount)));\n      if (c.params.hasRail !== undefined) env.hasRail = !!c.params.hasRail;\n      if (c.params.hasLift !== undefined) env.hasLift = !!c.params.hasLift;\n      if (c.params.tool) env.tool = c.params.tool;\n    } else if (c.robots && c.robots.length) {\n      const set = c.robots.slice().sort().join('/');\n      env.robotCount = set === 'C' ? 1 : set === 'SL/SR' ? 2 : 3;\n    }\n    this._condShown = null;\n    this.setState({ ...env, showCondModal: false, condRows: [] }, () => { this.push(); this.checkSimCond(); });\n  }\n\n  /* ══ 실행 중 컨트롤 — 일시정지/재개, 힘·이송 배율(정책 배율 위에 곱함). 서버가 워커/로컬 시뮬에 전달 ══ */\n  sendControl(patch) {\n    const next = { ...this.state.ctl, ...patch };\n    this.setState({ ctl: next });\n    fetch('/api/sim/control', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(patch) })\n      .then((r) => r.json()).then((d) => { if (d && d.control) this.setState({ ctl: d.control }); }).catch(() => {});\n  }\n  ctlStep(key, delta, lo, hi) {\n    const v = Math.round(Math.max(lo, Math.min(hi, (Number(this.state.ctl[key]) || 1) + delta)) * 100) / 100;\n    this.sendControl({ [key]: v });\n  }\n\n  toggleRun() {\n    if (this.state.replay && this.state.replay.active && !this._liveRun) return this.stopReplay();\n    /* 실행 직후 6 s 안의 클릭은 무시 — Isaac 기동(~60 s) 동안 반응이 없어 보여 다시 누르면 정지 요청이 나가 버린다 */\n    if (this.state.running && this._liveRun && this._runT0 && performance.now() - this._runT0 < 6000) return;\n    if (this.state.running) {\n      if (this._liveRun) {\n        fetch('/api/sim/stop', { method: 'POST', credentials: 'same-origin' }).catch(() => {});\n        this._liveRun = false;\n      }\n      return this.toggleRunDemo();\n    }\n    const s = this.state, t = toolOf(s.tool);\n    const body = { tool: s.tool, force: t.force, rpm: t.rpm, feed_mm_s: t.feed * 1000, overlap: t.overlap,\n                   robotCount: s.robotCount, hasRail: s.hasRail, hasLift: s.hasLift, pad: t.pad, carLift: s.carLift,\n                   recipe: s.recipe, physical: false, max_steps: 9000 };\n    fetch('/api/sim/start', { method: 'POST', credentials: 'same-origin',\n                              headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })\n      .then((r) => r.json().catch(() => ({})).then((d) => ({ ok: r.ok, status: r.status, d })))\n      .then(({ ok, status, d }) => {\n        if (!ok) throw new Error(d.error || ('launcher ' + status));\n        this._liveRun = true; this._hist = []; this._runT0 = performance.now(); this._liveRunId = null; this._simResult = null;\n        this.setState({ running: true, runMs: 0, runEl: 0, mon: this.liveMon(null, t) }, () => {\n          this.push(); this.stopTimers();\n          this._liveTimer = setInterval(() => this.pollLiveRun(t), 500);\n        });\n      })\n      .catch(() => { this._liveRun = false; this.toggleRunDemo(); });\n  }\n  pollLiveRun(t) {\n    Promise.all([\n      fetch('/api/monitor', { credentials: 'same-origin', cache: 'no-store' }).then((r) => r.json()).catch(() => null),\n      fetch('/api/sim/status', { credentials: 'same-origin', cache: 'no-store' }).then((r) => r.json()).catch(() => null),\n    ]).then(([m, st]) => {\n      const feed = m && m.live ? m.feed : null;\n      const v = this.vp();\n      const viaReplay = !!(this.state.replay && this.state.replay.active);\n      if (!viaReplay && v && v.setLive) v.setLive(feed);   // 3D 팔 = Isaac 관절 그대로 (폴링 경로)\n      /* 워커가 이 작업의 기록(run)을 올리기 시작하면 지연 재생기로 전환 — 청크를 미리 받아 보간하므로 렉이 없다 */\n      if (!viaReplay && st && (st.run_id || (st.job && st.job.id)) && !this._liveReplayTried && v && v.replay) {\n        this._liveReplayTried = performance.now();\n        if (st.run_id) { this.loadReplay(st.run_id, true); this.fetchRuns(); }      // 로컬 모드: 서버 테일러가 만든 기록\n        else fetch('/api/runs', { credentials: 'same-origin', cache: 'no-store' }).then((r) => r.json()).then((d) => {\n          const run = (d.runs || []).find((r) => r.job_id === st.job.id);          // 큐 모드: 워커가 올리는 기록\n          if (run) { this.setState({ runs: d.runs || [] }); this.loadReplay(run.id, true); }\n          else this._liveReplayTried = null;                      // 아직 없음 — 다음 폴링에서 다시\n        }).catch(() => { this._liveReplayTried = null; });\n      }\n      const el = performance.now() - this._runT0;\n      const extra = {};\n      if (st && st.control) extra.ctl = { pause: !!st.control.pause, force_scale: Number(st.control.force_scale) || 1, feed_scale: Number(st.control.feed_scale) || 1 };\n      if (st && st.worker_online !== undefined) extra.workerOnline = st.mode === 'queue' ? !!st.worker_online : null;\n      if (!viaReplay) this.setState({ runEl: el, mon: this.liveMon(feed, t), ...extra }); else this.setState({ runEl: el, ...extra });\n      const done = st && !st.running && (st.exitCode !== null || (feed && feed.state === 'DONE'));\n      if (done) {\n        this._liveRunId = (st && st.run_id) || (this.state.replayId ? Number(this.state.replayId) : null) || this._liveRunId || null;\n        this._liveReplayTried = null;\n        if (viaReplay && v && v._replay) { v.replay.stop(); this.setState({ replay: null, replayId: '' }); }\n        this.fetchRuns();\n      }\n      if (done && st.result) { this.stopTimers(); this._liveRun = false; this.finishLiveRun(st.result); }\n      else if (done) { this.stopTimers(); this._liveRun = false; this.finishRun(); }\n    });\n  }\n  liveMon(feed, t) {\n    const r0 = feed && feed.robots && feed.robots[0];\n    const force = r0 ? Number(r0.force) || 0 : 0;\n    const target = r0 ? Number(r0.target) || t.force : t.force;\n    const hist = this._hist || (this._hist = []);\n    hist.push(force); if (hist.length > 44) hist.shift();\n    const prog = feed ? Math.max(0, Math.min(1, Number(feed.progress) || 0)) : 0;\n    if (feed && (feed.recipe || (feed.robots && feed.robots.length))) this._noteSimCond({ recipe: feed.recipe || null, robots: (feed.robots || []).map((r) => r.id) });\n    return { prog, force, dev: force - target, target, rpm: t.rpm, feed: t.feed * 1000,\n             cov: prog * 100, hist: hist.slice(), cells: [], points: 0, assigned: 0, live: !!feed,\n             starting: !feed };   // 피드가 아직 없음 = 작업 대기 또는 Isaac 기동 중\n  }\n  finishLiveRun(result) {\n    const seed = this.state.seed;\n    const seq = this.state.runSeq + 1;\n    const ref = seed && seed.length ? seed[(seq - 1) % seed.length] : null;\n    const q = result.quality || {}, rl0 = result.rl || {};\n    const qualEp = Object.assign({ episode: seq, recipe: 'rl_live', seed: 0, cells: q.cells || 0 }, q);\n    /* 숙련공 정답(ref)이 없어도 실제 결과는 남긴다 — 자동 등록(evalSave(true)) 에 필요 */\n    const rl = {\n      force: Number(rl0.force) || (ref ? ref.p.force : 0),\n      stiffness: Number(rl0.stiffness) || (ref ? ref.p.stiffness : 0),\n      damping: Number(rl0.damping) || (ref ? ref.p.damping : 0),\n      speed: Number(rl0.feed_scale_mean) || 1.0,\n      inband: (result.cells && result.cells.polished) ? Math.min(1, (result.cells.pass || 0) / Math.max(1, result.cells.polished)) : 0,\n    };\n    this._simResult = result;\n    this.setState({ running: false, mon: null, showEvalModal: true, runSeq: seq, refSeg: ref, rl, qualEp,\n                    evalSaved: false, evalErr: '' }, () => { this.push(); this.evalSave(true); });   // 실제 실행 결과는 자동 등록\n  }\n  toggleRunDemo() {\n    if (this.state.running) {                 // 진행 중 누르면 중단\n      this.stopTimers();\n      this.setState({ running: false, mon: null, runEl: 0 }, () => this.push());\n      return;\n    }\n    /* 공정 길이는 30~60초 사이에서 매번 다르게 잡는다. 같은 길이로 고정하면\n       두 번째 실행부터 타이머를 보는 화면이 된다. */\n    const runMs = 30000 + Math.floor(Math.random() * 30001);\n    this._hist = [];\n    this._runT0 = performance.now();\n    this.setState({ running: true, runMs, runEl: 0, mon: this.sampleMon(0, runMs) }, () => {\n      this.push();\n      this.stopTimers();\n      this._simTimer = setTimeout(() => this.finishRun(), runMs);\n      /* 200ms — 사람이 수치가 산다고 느끼는 하한이면서, 값이 읽기 전에\n         바뀌어 버리지 않는 상한이다 */\n      this._monTimer = setInterval(() => {\n        const el = performance.now() - this._runT0;\n        this.setState({ runEl: el, mon: this.sampleMon(el, this.state.runMs) });\n      }, 200);\n    });\n  }\n\n  /* 계측값. 뷰포트가 실제로 돌리고 있는 수를 그대로 읽어 온다 —\n     패널에만 있는 숫자를 따로 만들면 3D 와 패널이 어긋난다. */\n  sampleMon(elapsed, total) {\n    const s = this.state, t = toolOf(s.tool);\n    const prog = total > 0 ? Math.min(1, elapsed / total) : 0;\n    const vp = this.vp();\n    const st = (vp && vp.getStats) ? vp.getStats() : null;\n\n    /* 접촉력은 목표를 중심으로 흔들린다. 곡면에 들어가면 잠깐 내려가고\n       평면으로 나오면 회복한다 — 주기가 다른 성분 셋을 겹쳐 그 모양을 만든다 */\n    const ph = elapsed / 1000;\n    const wob = Math.sin(ph * 2.3) * 0.30 + Math.sin(ph * 5.7) * 0.17 + Math.sin(ph * 11.3) * 0.08;\n    const force = Math.max(0, t.force + wob);\n    const dev = Math.abs(force - t.force);\n\n    const hist = this._hist || (this._hist = []);\n    hist.push(force);\n    if (hist.length > 44) hist.shift();       // 패널 폭에 들어가는 만큼만\n\n    return {\n      prog,\n      force, dev,\n      target: t.force,\n      rpm: t.rpm,\n      feed: t.feed * 1000,                    // m/s -> mm/s\n      // 뷰포트가 실제로 찍은 면적. 없으면(초기 프레임) 0 으로 둔다 —\n      // 시간 진행률을 대신 넣으면 3D 에는 안 닦인 차가 100% 로 표시된다\n      cov: st && st.polished != null ? st.polished * 100 : 0,\n      hist: hist.slice(),\n      cells: st ? st.cells : [],\n      points: st ? st.points : 0,\n      assigned: st ? st.assigned : 0,\n    };\n  }\n\n  // RL 탐색이 끝났다. 대상 세그먼트의 정답을 기준으로 결과를 만들고 판정 화면을 열다.\n  finishRun() {\n    this.stopTimers();\n    const seed = this.state.seed;\n    if (!seed || !seed.length) {\n      this.setState({ running: false, mon: null, showEvalModal: true, refSeg: null, rl: null,\n                      qualEp: this.pickEpisode(this.state.runSeq + 1) }, () => this.push());\n      return;\n    }\n    const seq = this.state.runSeq + 1;\n    const ref = seed[(seq - 1) % seed.length];\n    const rnd = lcg(seq * 2654435761 + ref.seg.length * 8191);\n\n    // 탐색이 수렴했는지 — 수렴하면 전 항목이 허용 오차 안,\n    // 아니면 한두 항목이 밖으로 벗어난다. 벗어난 판정도 보여야 하는 화면이다.\n    const converged = rnd() < 0.7;\n    const keys = ['force', 'stiffness', 'damping', 'speed'];\n    const off = {};\n    keys.forEach((k) => { off[k] = rnd() * 1.6 - 0.8; });\n    if (!converged) {\n      const n = rnd() < 0.4 ? 2 : 1;\n      for (let i = 0; i < n; i++) {\n        const k = keys[Math.min(keys.length - 1, Math.floor(rnd() * keys.length))];\n        off[k] = (rnd() < 0.5 ? -1 : 1) * (1.35 + rnd() * 1.15);\n      }\n    }\n    const rl = {\n      force: ref.p.force + off.force * TOL.force,\n      stiffness: ref.p.stiffness * (1 + off.stiffness * TOL.stiffness),\n      damping: ref.p.damping * (1 + off.damping * TOL.damping),\n      speed: ref.p.speed * (1 + off.speed * TOL.speed),\n      inband: Math.max(0, ref.inband - (converged ? rnd() * 0.014 : 0.025 + rnd() * 0.07)),\n    };\n    this.setState({ running: false, mon: null, showEvalModal: true, runSeq: seq, refSeg: ref, rl,\n                    qualEp: this.pickEpisode(seq), evalSaved: false,\n                    evalSaving: false, evalErr: '' }, () => this.push());\n  }\n\n  /* 공정 모니터링 패널이 그리는 값. 대기 중에는 설정 패널이 대신 뜬다. */\n  monVals() {\n    const s = this.state, m = s.mon;\n    const rp = s.replay && s.replay.active ? s.replay : null;\n    const idle = !(s.running || rp) || !m;\n    if (idle) {\n      return { running: false, idle: true, panelTitle: 'PARAMETERS',\n               monBars: [], monRobots: [] };\n    }\n    const pct = m.prog * 100;\n    // 재생 중이면 시뮬 시각(기록의 t) 을 그대로 — 공정 시간이 곧 시뮬 시간이다\n    const leftSec = rp ? Math.max(0, Math.round(rp.duration - rp.t)) : Math.max(0, Math.round((s.runMs - s.runEl) / 1000));\n    const elSec = rp ? Math.round(rp.t) : Math.round(s.runEl / 1000);\n    // 접촉력이 목표에서 얼마나 벗어났나 — 이 화면에서 관리자가 제일 먼저 볼 값\n    const warn = m.dev > 0.55;\n    const stateColor = warn ? 'var(--warn)' : 'var(--ok)';\n\n    /* 접촉력 이력. 목표선을 가운데(50%)에 두고 위아래로 그린다.\n       값은 즉시 바뀐다 — 막대에 트랜지션을 걸면 계측이 아니라 애니메이션이 된다 */\n    const span = 2.4;                        // 위아래로 보여 줄 폭 (N)\n    const monBars = m.hist.map((v) => {\n      const d = Math.max(-1, Math.min(1, (v - m.target) / span));\n      return {\n        h: (6 + Math.abs(d) * 44).toFixed(1) + '%',\n        bottom: d >= 0 ? '50%' : 'auto',\n        top: d < 0 ? '50%' : 'auto',\n        bg: Math.abs(v - m.target) > 0.55 ? 'var(--warn)' : 'var(--accent)',\n      };\n    });\n\n    const monRobots = (m.cells || []).map((c, i) => ({\n      label: 'R' + (i + 1),\n      pts: String(c.pts) + ' pt',\n      lap: (c.lap * 100).toFixed(0) + '%',\n      barW: (c.lap * 100).toFixed(1) + '%',\n      rail: c.onRail ? '레일' : '고정',\n      railColor: c.onRail ? 'var(--accent)' : 'var(--text-lo)',\n    }));\n\n    return {\n      running: true, idle: false, panelTitle: rp ? (rp.follow ? '공정 모니터링 · 지연 재생' : '기록 재생') : (m.starting ? '공정 모니터링 · Isaac 기동 중 (약 1분)' : '공정 모니터링'),\n      monPct: pct.toFixed(1),\n      monBarW: pct.toFixed(1) + '%',\n      monElapsed: rp ? hhmm(elSec) : mmss(elSec),\n      monLeft: rp ? hhmm(leftSec) : mmss(leftSec),\n      monTotal: rp ? hhmm(rp.duration) : mmss(Math.round(s.runMs / 1000)),\n      monForce: m.force.toFixed(2),\n      monTarget: m.target.toFixed(1),\n      monDev: (m.force >= m.target ? '+' : '–') + m.dev.toFixed(2),\n      monRpm: String(m.rpm),\n      monFeed: m.feed.toFixed(0),\n      monCov: m.cov.toFixed(1),\n      monPoints: String(m.points),\n      monAssigned: String(m.assigned),\n      monReach: m.points > 0 ? (100 * m.assigned / m.points).toFixed(0) : '0',\n      /* 미도달이 남는 것은 결함이 아니라 이 구성의 사실이다. 그대로 적는다 */\n      monReachNote: m.points > 0\n        ? ('도달 ' + m.assigned.toLocaleString() + ' / ' + m.points.toLocaleString()\n           + ' pt · 미도달 구간은 검증 리포트로 남는다')\n        : '',\n      monStateLabel: warn ? '접촉력 이탈' : '정상 추종',\n      monStateColor: stateColor,\n      monBars, monRobots,\n    };\n  }\n\n  /* 실행 순번으로 에피소드를 고른다 — 세그먼트를 고르는 방식과 같다.\n     같은 순번이면 같은 에피소드가 나와 데모 중에 재현이 된다. */\n  pickEpisode(seq) {\n    const q = this.state.qual;\n    if (!q || !q.episodes || !q.episodes.length) return null;\n    return q.episodes[(seq - 1 + q.episodes.length) % q.episodes.length];\n  }\n\n  /* 표면 품질 판정. 왼쪽은 이번 공정 결과, 오른쪽은 합격 기준이다.\n     기준의 부등호 방향(>= / <= / <)은 quality_kpi.json 이 들고 있다 —\n     화면에서 다시 정의하면 두 곳이 어긋난다. */\n  qualRows() {\n    const q = this.state.qual, ep = this.state.qualEp;\n    if (!q || !ep) return [];\n    const BAND = { target_pass: '목표 충족', partial: '부분', low: '낮음', severe_defect: '심한 결함' };\n    return (q.criteria || []).map((c) => {\n      const v = ep[c.key];\n      const d = c.digits != null ? c.digits : 2;\n      let ok, limitText, detail = '';\n      if (c.op === 'gloss') {\n        /* 광택은 평균만으로 통과시키지 않는다 — 평균·p10·산포·최소를 모두 본다.\n           한 군데가 깊게 파여도 평균은 멀쩡해 보이기 때문이다.\n           판정 자체는 make_quality.py 가 이미 내려 둔 것을 쓴다. */\n        const g = (q.gloss && q.gloss.pass) || { mean: 70, p10: 60, std: 10, min: 45 };\n        ok = !!ep.glossPass;\n        limitText = '평균 ≥ ' + g.mean + ' GU';\n        detail = 'p10 ' + ep.glossP10.toFixed(1) + ' (≥' + g.p10 + ')'\n               + ' · σ ' + ep.glossStd.toFixed(1) + ' (≤' + g.std + ')'\n               + ' · 최소 ' + ep.glossMin.toFixed(1) + ' (≥' + g.min + ')'\n               + ' · 타일 ' + ep.glossTiles + ' · ' + (BAND[ep.glossBand] || ep.glossBand);\n      } else if (c.op === '<') {               // 스크래치 — 초기 대비 감소\n        const base = ep.scratchBefore;\n        ok = v < base;\n        limitText = '초기 ' + base.toFixed(d) + ' 대비 감소';\n      } else if (c.op === '>=') {\n        ok = v >= c.limit;  limitText = '≥ ' + c.limit.toFixed(d === 4 ? 2 : d) + (c.unit ? ' ' + c.unit : '');\n      } else {\n        ok = v <= c.limit;  limitText = '≤ ' + c.limit.toFixed(d === 4 ? 2 : d) + (c.unit ? ' ' + c.unit : '');\n      }\n      return {\n        label: c.label,\n        mine: v.toFixed(d),\n        unit: c.unit || '',\n        limit: limitText,\n        detail,\n        hasDetail: !!detail,\n        ok,\n        color: ok ? 'var(--ok)' : 'var(--crit)',\n        mark: ok ? '충족' : '미달',\n      };\n    });\n  }\n\n  // 판정 행 — 두 패널이 같은 순서로 그린다. 왼쪽은 색과 Δ, 오른쪽은 값과 단위.\n  evalRows() {\n    const ref = this.state.refSeg, rl = this.state.rl;\n    if (!ref || !rl) return [];\n    const defs = [\n      { key: 'force',     label: '접촉력 목표', unit: 'N',    d: 2, tol: TOL.force, abs: true },\n      { key: 'stiffness', label: '패드 강성 k', unit: 'N/m',  d: 1, tol: TOL.stiffness },\n      { key: 'damping',   label: '감쇠 c',      unit: 'Ns/m', d: 2, tol: TOL.damping },\n      { key: 'speed',     label: '속도 배율',   unit: 'x',    d: 2, tol: TOL.speed },\n    ];\n    const rows = defs.map((f) => {\n      const mine = rl[f.key], want = ref.p[f.key], diff = mine - want;\n      const ok = Math.abs(diff) <= (f.abs ? f.tol : Math.abs(want) * f.tol);\n      return { label: f.label, unit: f.unit, ok,\n               mine: mine.toFixed(f.d), ref: want.toFixed(f.d),\n               delta: (diff >= 0 ? '+' : '-') + Math.abs(diff).toFixed(f.d),\n               color: ok ? 'var(--ok)' : 'var(--crit)' };\n    });\n    const dIn = rl.inband - ref.inband;\n    const okIn = dIn >= -TOL.inband;\n    rows.push({ label: 'in-band 비율', unit: '', ok: okIn,\n                mine: rl.inband.toFixed(3), ref: ref.inband.toFixed(3),\n                delta: (dIn >= 0 ? '+' : '-') + Math.abs(dIn).toFixed(3),\n                color: okIn ? 'var(--ok)' : 'var(--crit)' });\n    return rows;\n  }\n\n  // 일치할 때만 저장한다. 저장은 서버 DB(library_entries)로 간다 —\n  // 예전 localStorage 'polytwin_saved' 는 이 브라우저에만 남아서 다른\n  // PC 에서는 보이지 않았고 누가 저장했는지도 알 수 없었다.\n  evalSave(auto) {\n    const ref = this.state.refSeg, rl = this.state.rl, s = this.state;\n    const sim = this._simResult || null;                 // 실제 시뮬 결과 요약 (finishLiveRun)\n    if (!rl) return;\n    if (!auto && (!ref || this.evalRows().some((r) => !r.ok))) return;\n    if (auto && !sim) return;\n    if (s.evalSaving || s.evalSaved) return;\n\n    const when = new Date();\n    const stamp = when.getFullYear() + '-' + String(when.getMonth() + 1).padStart(2, '0') + '-' + String(when.getDate()).padStart(2, '0')\n                + ' ' + String(when.getHours()).padStart(2, '0') + ':' + String(when.getMinutes()).padStart(2, '0');\n    const rec = {\n      id: 'rl-' + Date.now(),\n      seg: ref ? ref.seg : 'sim',\n      name: ref ? (ref.seg + ' · ' + ref.robot + ' 로봇 · RL 검증') : ('RL 실행 · ' + stamp + (sim && sim.cells ? ' · 셀 ' + (sim.cells.pass || 0) + '/' + (sim.cells.cells || 0) : '')),\n      env: { robotCount: s.robotCount, tool: s.tool, hasRail: s.hasRail, hasLift: s.hasLift, carLift: s.carLift },\n      rl: { force: rl.force, stiffness: rl.stiffness, damping: rl.damping, speed: rl.speed, inband: rl.inband },\n      ref: ref || null,\n      sim: sim ? { quality: sim.quality || null, rl: sim.rl || null, cells: sim.cells || null, recipe: sim.recipe || null,\n                   elapsed_s: sim.elapsed_s || null, tag: sim.tag || null } : null,\n      run_id: this._liveRunId || null,\n    };\n    // 시각은 서버가 찍는다 — 클라이언트 시계를 믿고 정렬하지 않는다\n\n    // ① 화면의 '저장된 최적 프리셋 불러오기' 가 읽는 자리. 이건 이 브라우저의\n    // 편의 값이라 로컬에 그대로 둔다 — 실패해도 저장 자체를 막지 않는다\n    try {\n      localStorage.setItem('polytwin_preset', JSON.stringify({\n        robotCount: s.robotCount, tool: s.tool, hasRail: s.hasRail, hasLift: s.hasLift,\n        seg: ref ? ref.seg : 'sim', force: rl.force, stiffness: rl.stiffness, damping: rl.damping, speed: rl.speed,\n      }));\n    } catch (err) { /* 무시 */ }\n\n    this.setState({ evalSaving: true, evalErr: '' });\n    fetch('/api/library', {\n      method: 'POST',\n      credentials: 'same-origin',\n      headers: { 'Content-Type': 'application/json' },\n      body: JSON.stringify(rec),\n    })\n      .then((r) => r.json().catch(() => ({})).then((d) => {\n        if (!r.ok) throw new Error(d.error || '저장하지 못했습니다.');\n        return d;\n      }))\n      .then(() => this.setState({ evalSaving: false, evalSaved: true, evalErr: '' }))\n      .catch((err) => this.setState({\n        evalSaving: false, evalSaved: false,\n        evalErr: String((err && err.message) || err),\n      }));\n  }\n\n  evalFail() {\n    this.setState({ showEvalModal: false, evalSaved: false, evalSaving: false, evalErr: '' });\n  }\n\n  readPreset() {\n    try { return JSON.parse(localStorage.getItem('polytwin_preset') || 'null'); } catch (e) { return null; }\n  }\n\n  loadPreset() {\n    const preset = this.readPreset();\n    if (!preset) return;\n    this.setState({\n      robotCount: preset.robotCount || 1,\n      tool: preset.tool || 'dual',\n      hasRail: !!preset.hasRail,\n      hasLift: !!preset.hasLift,\n    }, () => this.push());\n  }\n\n  renderVals() {\n    const s = this.state;\n    const tool = toolOf(s.tool);\n    const ev = this.evalRows();\n    const failed = ev.filter((r) => !r.ok).length;\n    const qr = this.qualRows();\n    const qFailed = qr.filter((r) => !r.ok).length;\n    // 품질표가 없으면(파일 미배치) 파라미터 판정만으로 본다\n    const evOk = ev.length > 0 && failed === 0 && qFailed === 0;\n    const ref = s.refSeg;\n    const noSeed = !ref;\n    const rc = (s.simCond && s.simCond.recipe) || null;   // 시뮬이 보고한 유효 레시피가 있으면 상태줄은 그 값\n    const spacing = rc && rc.step_over_ratio && rc.pad_radius_m ? Math.round(rc.step_over_ratio * rc.pad_radius_m * 2000) : Math.round(tool.pad * (1 - tool.overlap / 100));\n    // 작업 폭 약 1850mm 기준. 공구를 바꾸면 패스 수와 예상 시간이 따라 움직인다\n    const passes = rc && rc.n_passes ? rc.n_passes : Math.round(1850 / spacing);\n    const m0 = s.mon;\n    const simEta = m0 && m0.live && m0.prog > 0.02 && this.state.runEl ? Math.max(0, Math.round((this.state.runEl / 1000) * (1 - m0.prog) / m0.prog)) : null;\n    const rpEta = s.replay && s.replay.active ? Math.max(0, Math.round((s.replay.duration - s.replay.t) / Math.max(0.01, s.replay.speed))) : null;   // 배속 반영 실제 남은 시간\n    return {\n      vehicles: CARS.map((c) => ({\n        name: c.name, swatch: c.swatch,\n        border: s.vehicle === c.id ? 'var(--accent)' : 'var(--line)',\n        bg: s.vehicle === c.id ? 'rgb(var(--accent-ch) / 0.06)' : 'transparent',\n        pick: () => this.pickVehicle(c.id),\n      })),\n      vehicleName: (CARS.find((c) => c.id === s.vehicle) || CARS[0]).name,\n      views: [['front', '정면'], ['top', '상면'], ['side', '측면'], ['free', '자유']].map(([id, label]) => ({\n        label,\n        border: s.view === id ? 'var(--text-lo)' : 'var(--bg-raised)',\n        color: s.view === id ? 'var(--text-hi)' : 'var(--text-lo)',\n        pick: () => this.pickView(id),\n      })),\n      robotCounts: [1, 2, 3].map(n => ({\n        label: ({ 1: '1대 · 천장', 2: '2대 · 좌·우', 3: '3대 · 천장+좌·우' })[n],   // Isaac 배치와 같은 의미\n        border: s.robotCount === n ? 'var(--accent)' : 'var(--line)',\n        bg: s.robotCount === n ? 'rgb(var(--accent-ch) / 0.06)' : 'transparent',\n        color: s.robotCount === n ? 'var(--text-hi)' : 'var(--text-mid)',\n        pick: () => this.setState({ robotCount: n }, () => this.push())\n      })),\n      tools: TOOLS.map((t) => ({\n        label: t.label,\n        border: s.tool === t.id ? 'var(--accent)' : 'var(--line)',\n        bg: s.tool === t.id ? 'rgb(var(--accent-ch) / 0.06)' : 'transparent',\n        color: s.tool === t.id ? 'var(--text-hi)' : 'var(--text-mid)',\n        pick: () => this.setState({ tool: t.id }, () => this.push()),\n      })),\n      toolNote: tool.note,\n      toggleRail: () => this.setState(p => ({ hasRail: !p.hasRail }), () => this.push()),\n      railBg: s.hasRail ? 'var(--accent)' : 'var(--line)',\n      railDotLeft: s.hasRail ? '20px' : '2px',\n      toggleLift: () => this.setState(p => ({ hasLift: !p.hasLift }), () => this.push()),\n      carLift: String(s.carLift),\n      setCarLift: (e) => this.setState({ carLift: Number(e.target.value) }, () => this.push()),\n      carLiftLabel: s.carLift ? (s.carLift + ' mm') : '내림',\n      carLiftColor: s.carLift ? 'var(--accent)' : 'var(--text-lo)',\n      carLiftNote: s.carLift\n        ? ('차체를 ' + s.carLift + ' mm 올려 도어·펜더가 팔의 도달 범위에 들어온다. '\n           + '대신 루프가 그만큼 높아진다.')\n        : '차체가 내려와 있어 옆면 하단은 팔이 닿지 않는다. 올리면 측면 경로가 배정된다.',\n      liftBg: s.hasLift ? 'var(--accent)' : 'var(--line)',\n      liftDotLeft: s.hasLift ? '20px' : '2px',\n      spacing: String(spacing),\n      passes: String(passes),\n      eta: rpEta !== null ? hhmm(rpEta) : simEta !== null ? hhmm(simEta) : mmss(Math.round(passes * 8)),\n      showCondModal: s.showCondModal,\n      condRows: s.condRows,\n      condApply: () => this.condApply(),\n      condClose: () => { this.setState({ showCondModal: false }); },\n      runLabel: s.running ? (s.mon && s.mon.starting && this._liveRun ? 'Isaac 기동 중 — 잠시 기다려 주세요' : '공정 중단') : (s.replay && s.replay.active ? '재생 중지' : 'RL 공정 시작'),\n      hasRuns: s.runs.length > 0,\n      runOpts: s.runs.map((r) => ({ id: String(r.id),\n        label: (r.name || ('run ' + r.id)) + ' · ' + (r.status === 'recording' ? '기록 중' : r.status === 'done' ? '완료' : r.status)\n               + ' · ' + mmss(Math.round(Number(r.t_sim_end) || 0)) })),\n      replayId: s.replayId,\n      monitorHref: s.replayId ? ('monitor.html?run=' + s.replayId + '&speed=' + (s.replay ? s.replay.speed : 1)) : 'monitor.html',\n      replayPos: s.replay && s.replay.duration > 0 ? String(Math.round(1000 * s.replay.t / s.replay.duration)) : '0',\n      replayTime: s.replay ? (hhmm(s.replay.t) + ' / ' + hhmm(s.replay.duration) + (s.replay.follow ? ' · LIVE' : (' · ' + s.replay.speed + 'x → 남은 실제 ' + mmss(Math.max(0, Math.round((s.replay.duration - s.replay.t) / Math.max(0.01, s.replay.speed))))))) : '',\n      replayBtn: s.replay && s.replay.playing ? '일시정지' : '재생',\n      cellsOn: !!s.cellsOn,\n      cellsLabel: s.cellsOn ? '셀 판정 표시: 켬' : '셀 판정 표시: 끔',\n      toggleCells: () => this.setState({ cellsOn: !s.cellsOn }, () => { const v = this.vp(); if (v && v.setCellsVisible) v.setCellsVisible(this.state.cellsOn); }),\n      deleteRun: () => this.deleteRun(),\n      replaySpeedVal: String(s.replay ? s.replay.speed : 1),\n      speedOpts: [1, 4, 16, 32, 64, 128].map((x) => ({ label: x + 'x',\n        border: s.replay && s.replay.speed === x ? 'var(--accent)' : 'var(--line)',\n        bg: s.replay && s.replay.speed === x ? 'rgb(var(--accent-ch) / 0.08)' : 'transparent',\n        color: s.replay && s.replay.speed === x ? 'var(--text-hi)' : 'var(--text-mid)',\n        pick: () => { const v = this.vp(); if (v && v._replay) v.replay.setSpeed(x); } })),\n      pickRun: (e) => this.pickRun(e),\n      replayToggle: () => this.replayToggle(),\n      replaySeek: (e) => this.replaySeek(e),\n      replaySpeed: (e) => this.replaySpeed(e),\n      runBorder: s.running ? 'var(--warn)' : 'var(--accent)',\n      runBg: s.running ? 'rgb(var(--warn-ch) / 0.1)' : 'rgb(var(--accent-ch) / 0.1)',\n      ...this.monVals(),\n      toggleRun: () => this.toggleRun(),\n      recipe: s.recipe,\n      setRecipe: (e) => this.setState({ recipe: String(e.target.value || 'base') }),\n      recipeNote: ({ base: '기준 레시피 — BO 최적(이송 5.65 mm/s · 6.69 N), 셀당 309 s',\n                     fast: '시간 단축 — 이송 ×1.5 · 힘 ×1.15, 150셀
